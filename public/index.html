<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touchline</title>
<meta name="description" content="A football management game where every rival manager thinks for itself. Three matches, three managers on SERV Reasoning who scout you, counter you and change shape at half-time.">
<meta property="og:title" content="Touchline: out-think three AI managers">
<meta property="og:description" content="Every rival manager scouts you, picks a counter-plan and adapts at half-time, on SERV Reasoning.">
<meta property="og:image" content="https://touchline.nerom.site/img/tunnel.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230B0E0C%22/%3E%3Cpath d=%22M6 22h20%22 stroke=%22%23C6F432%22 stroke-width=%224%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="/img/stadium.jpg">
<style>
:root{--bg:#F3F0E9;--panel:#FFFFFF;--panel2:#F1EEE6;--line:#E3DED2;--ink:#121316;--mute:#6D727B;--lime:#3D5BFF;--red:#E5341D;--amber:#E69A00}
.title,.overlay,.season,.fixture,.hero,.setup{--ink:#F5F4EF;--mute:#B4BAC0;--line:rgba(255,255,255,.16);--panel:rgba(13,15,18,.86);--panel2:rgba(255,255,255,.09);--lime:#6E86FF;color:var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.cond{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em}
.mono{font-family:'JetBrains Mono',monospace}
.small{font-size:13.5px;color:var(--mute);line-height:1.5}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pl{50%{opacity:.25}}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.top{display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(243,240,233,.88);backdrop-filter:blur(12px);z-index:5}
.brand{font:800 24px 'Barlow Condensed';letter-spacing:.06em}.brand i{color:var(--lime);font-style:normal}
.pips{display:flex;align-items:center;gap:6px;margin-right:auto;font:600 12px 'JetBrains Mono';color:var(--mute)}
.pips span{width:22px;height:5px;border-radius:3px;background:var(--line)}.pips span.done{background:var(--ink)}.pips span.now{background:var(--lime)}
.pips em{font-style:normal;margin-left:6px}
.servchip{display:flex;align-items:center;gap:12px;font:12px 'JetBrains Mono';color:var(--mute);border:1px solid var(--line);border-radius:30px;padding:7px 14px;background:#fff}
.servchip b{color:var(--ink);font-weight:600}.servchip .dot{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.servchip.busy{border-color:var(--amber)}.servchip.busy .dot{background:var(--amber);animation:pl .8s infinite}
.snd{background:transparent;border:1px solid var(--line);border-radius:30px;padding:7px 12px;font:600 12px 'JetBrains Mono';color:var(--mute);cursor:pointer}
.wrap{max-width:1400px;margin:0 auto;padding:20px 22px 40px;animation:up .45s ease both}
.title{position:relative;min-height:100vh;display:flex;align-items:flex-end;overflow:hidden}
.title .bgi{position:absolute;inset:0;background:url(/img/tunnel.jpg) center/cover;animation:kb 9s ease-out both}
.title:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,10,.05) 0%,rgba(6,8,10,.3) 45%,rgba(6,8,10,.97) 100%)}
.title .in{position:relative;z-index:1;padding:48px;max-width:880px}
.title .in>*{animation:up .7s ease both}.title .in>*:nth-child(2){animation-delay:.12s}.title .in>*:nth-child(3){animation-delay:.24s}.title .in>*:nth-child(4){animation-delay:.36s}.title .in>*:nth-child(5){animation-delay:.48s}
.title h1{font:800 clamp(64px,11vw,148px)/.86 'Barlow Condensed';text-transform:uppercase}
.title h1 i{color:var(--lime);font-style:normal}
.title p{font-size:19px;line-height:1.5;color:#D5DBD3;margin:16px 0 26px;max-width:620px}
.mgrs{display:flex;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.mgr{display:flex;align-items:center;gap:10px;background:rgba(16,20,23,.78);border:1px solid var(--line);border-radius:14px;padding:8px 14px 8px 8px;backdrop-filter:blur(6px)}
.mgr img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.mgr b{display:block;font-size:14px}.mgr span{font-size:12px;color:var(--mute)}
.btn{appearance:none;border:0;background:var(--lime);color:#fff;font:700 20px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;padding:14px 28px;border-radius:12px;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 8px 30px rgba(61,91,255,.18);text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(61,91,255,.3)}.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.wide{width:100%;text-align:center}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 1px 0 rgba(20,20,30,.03),0 10px 30px rgba(20,20,30,.06)}
.th{padding:13px 16px;border-bottom:1px solid var(--line);font:700 14px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.tb{padding:16px}
.fixture{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:18px;background:url(/img/stadium.jpg) center 62%/cover}
.fixture:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,12,.9) 0%,rgba(8,9,12,.5) 45%,rgba(8,9,12,.88) 100%)}
.fixture .fin{position:relative;display:grid;grid-template-columns:1fr auto 1fr auto;gap:22px;align-items:center;padding:22px 26px}
.side{display:flex;align-items:center;gap:14px}.side.r{justify-content:flex-end;text-align:right}
.side h2{font:800 38px/1 'Barlow Condensed';text-transform:uppercase}
.side span{font:600 12px 'JetBrains Mono';color:var(--mute)}
.vs{text-align:center}.vs b{display:block;font:800 30px 'Barlow Condensed';color:var(--lime)}.vs span{font:600 11px 'JetBrains Mono';color:var(--mute);letter-spacing:.08em}
.boss{display:flex;gap:12px;align-items:center;background:rgba(16,20,23,.8);border:1px solid var(--line);border-radius:16px;padding:10px 16px 10px 10px;width:380px}
.boss img{width:74px;height:74px;border-radius:12px;object-fit:cover;flex:none}
.boss b{font-size:16px}.boss em{font:500 12.5px/1.4 Inter;color:var(--mute);font-style:normal;display:block;margin:2px 0 6px}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:pl 1s infinite;flex:none}.pulse.ok{background:var(--lime);animation:none}
.hub{display:grid;grid-template-columns:1.05fr 1fr .85fr;gap:18px;align-items:start}
.tg{display:grid;gap:16px}
.tg label{font:600 11px 'JetBrains Mono';color:var(--mute);display:block;margin-bottom:7px;letter-spacing:.08em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font:600 14px Inter;cursor:pointer;transition:all .12s}
.seg button:hover{border-color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px;font:600 14px Inter;width:100%}
canvas{display:block;width:100%;height:auto}
.hint{font-size:13px;color:var(--mute);line-height:1.45;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td,.tbl th{padding:8px 5px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font:600 11px 'JetBrains Mono';color:var(--mute)}
.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:left}
.tbl td:nth-child(2) div{display:flex;align-items:center;gap:8px}
.tbl tr.me td{color:var(--lime);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}.row:last-child{border-bottom:0}
.row .pos{font:600 11px 'JetBrains Mono';color:var(--mute);width:22px}.row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:600 11.5px 'JetBrains Mono';padding:3px 7px;border-radius:6px;background:var(--panel2);min-width:34px;text-align:center}
.pill.g{background:#E2E8FF;color:#2437C9}.pill.b{background:#FDE4DF;color:#C2290F}
.sb{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:16px 24px}
.sb .tm{display:flex;align-items:center;gap:14px}.sb .tm.r{justify-content:flex-end;text-align:right}
.sb h3{font:800 30px/1 'Barlow Condensed';text-transform:uppercase}
.sb .sc{font:12.5px Inter;color:var(--mute);margin-top:4px;min-height:17px}
.big{font:800 64px/1 'Barlow Condensed';display:flex;gap:14px;align-items:center;justify-content:center}
.big span{min-width:38px;text-align:center;display:inline-block}.big .bump{animation:bump .6s ease}
@keyframes bump{30%{transform:scale(1.5);color:var(--lime)}}
.clock{font:600 14px 'JetBrains Mono';color:var(--lime);text-align:center;margin-top:2px}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--lime);transition:width .3s linear}
.cc{display:grid;grid-template-columns:270px 1fr 340px;gap:18px;margin-top:18px;align-items:start}
.pitchbox{position:relative}
.goalban{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.goalban.show{animation:gb 2.3s ease both}
@keyframes gb{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.06)}}
.goalban div{text-align:center;text-shadow:0 6px 40px rgba(0,0,0,.8)}
.goalban b{display:block;font:800 150px/.85 'Barlow Condensed';letter-spacing:.02em;color:#fff}
.goalban span{font:700 30px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.06em;background:var(--lime);color:#fff;padding:4px 14px;border-radius:8px;text-shadow:none}
.feed{max-height:330px;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.ev{font-size:13.5px;line-height:1.45;display:grid;grid-template-columns:34px 1fr;gap:8px;animation:up .3s ease both}
.ev .m{font:600 12px 'JetBrains Mono';color:var(--mute);padding-top:1px}
.ev.goal{background:var(--ink);border-radius:10px;padding:8px 10px;color:var(--panel);font-weight:700}.ev.goal .m{color:#9AA0AA}
.ev.note{color:var(--mute)}
.rival{display:flex;gap:12px;align-items:center}
.rival img{width:62px;height:62px;border-radius:12px;object-fit:cover;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 12px 'JetBrains Mono';background:var(--panel2);border:1px solid var(--line);padding:5px 8px;border-radius:7px}
.chip.l{border-color:var(--lime);color:var(--lime)}
.quote{font:600 21px/1.25 'Barlow Condensed';border-left:3px solid var(--lime);padding-left:12px;margin-top:12px}
.st{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center;font:600 13px 'JetBrains Mono';margin-bottom:10px}
.st em{grid-column:1/-1;font:600 10.5px 'JetBrains Mono';color:var(--mute);text-align:center;font-style:normal;letter-spacing:.08em;margin-bottom:-6px}
.st .split{height:11px;border-radius:6px;display:flex;overflow:hidden;gap:2px;background:#1B1F27;padding:2px}.st .split i{display:block;height:100%;border-radius:4px}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;overflow:auto;animation:fade .4s ease both}
.overlay .obg{position:fixed;inset:0;background-size:cover;background-position:center}
.overlay .obg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,10,.5),rgba(6,8,10,.82))}
.versus{position:relative;text-align:center;max-width:1100px}
.versus .line{display:flex;align-items:center;justify-content:center;gap:30px;animation:up .6s ease both}
.versus h2{font:800 clamp(30px,4.4vw,64px)/1 'Barlow Condensed';text-transform:uppercase;white-space:nowrap}
.versus .v{font:800 34px 'Barlow Condensed';color:var(--lime)}
.versus .q{font:600 30px/1.2 'Barlow Condensed';margin-top:26px;animation:up .6s .5s ease both}
.versus .who{margin-top:10px;color:var(--mute);font-size:14px;animation:up .6s .7s ease both}
.modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;max-width:1080px;width:100%;overflow:hidden;backdrop-filter:blur(14px);animation:up .5s ease both}
.mh{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mgrid{display:grid;grid-template-columns:1.1fr 1fr}
.mgrid>div{padding:20px 22px}.mgrid>div+div{border-left:1px solid var(--line)}
textarea{width:100%;min-height:92px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:15px Inter;padding:12px;resize:vertical}
textarea:focus{outline:1px solid var(--lime)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--mute)}
.quick button:hover{color:var(--ink);border-color:var(--ink)}
.room{max-height:440px;overflow:auto}
.pr{padding:8px 0;border-bottom:1px solid var(--line)}.pr:last-child{border-bottom:0}
.pr .l1{display:flex;align-items:center;gap:8px;font-size:14px}.pr .l1 b{flex:1;font-weight:600}
.pr .tr{font-size:12px;color:var(--mute)}
.pr .why{font-size:12.5px;color:#C9D2CC;margin-top:3px;line-height:1.4;animation:up .4s ease both}
.delta{font:700 12px 'JetBrains Mono';padding:3px 7px;border-radius:6px;animation:up .4s ease both}
.delta.up{background:#E2E8FF;color:#2437C9}.delta.down{background:#FDE4DF;color:#C2290F}
.tone{font:800 26px/1.1 'Barlow Condensed';text-transform:uppercase;margin-bottom:4px}
.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:18px;background:url(/img/stadium.jpg) center 62%/cover}
.hero:before{content:"";position:absolute;inset:0;background:rgba(6,8,10,.78)}
.hero .hin{position:relative;padding:26px;text-align:center}
.res{display:inline-block;font:800 16px 'Barlow Condensed';letter-spacing:.14em;padding:4px 14px;border-radius:8px;margin-bottom:10px}
.ft{display:flex;align-items:center;justify-content:center;gap:28px}
.ft h2{font:800 40px/1 'Barlow Condensed';text-transform:uppercase}
.ft .n{font:800 96px/1 'Barlow Condensed'}
.end{display:grid;grid-template-columns:.85fr 1.15fr;gap:18px;align-items:start}
.tl{position:relative;padding-left:26px;margin:6px 0 4px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.nt{position:relative;padding:0 0 14px;animation:up .4s ease both}
.nt:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(61,91,255,.15)}
.nt .s{font-size:13.5px;color:var(--mute);line-height:1.45}.nt .d{font-size:15px;line-height:1.45;margin-top:2px}
.nt .k{font:600 10px 'JetBrains Mono';letter-spacing:.1em;color:var(--mute);margin-right:6px}.nt .d .k{color:var(--lime)}
.sec{font:600 11px 'JetBrains Mono';letter-spacing:.06em;color:var(--mute);margin:16px 0 10px;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
details{margin-top:6px}summary{cursor:pointer;font:600 12px 'JetBrains Mono';color:var(--mute)}
pre{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font:12px/1.55 'JetBrains Mono';color:var(--mute);margin-top:8px}
.season{position:relative;min-height:calc(100vh - 56px);display:flex;align-items:flex-end;background-size:cover;background-position:center}
.season:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,10,.94) 0%,rgba(6,8,10,.7) 46%,rgba(6,8,10,.15) 100%)}
.season .in{position:relative;padding:44px;max-width:640px;animation:up .7s ease both}
.season h1{font:800 clamp(64px,9vw,128px)/.88 'Barlow Condensed';text-transform:uppercase}
.av{border-radius:50%;background-color:#2A2F38;background-repeat:no-repeat;flex:none;display:inline-block}
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:12px}
.pc{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left}
.pc:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(20,20,30,.16)}
.pc.in{background:#fff;border-color:var(--ink)}
.pc .ph{width:100%;aspect-ratio:1;border-radius:12px;background-color:#2A2F38;background-repeat:no-repeat}
.pc .ov{position:absolute;top:16px;left:16px;font:800 22px 'Barlow Condensed';color:#fff;background:rgba(10,12,16,.75);padding:1px 7px;border-radius:7px}
.pc .ps{position:absolute;top:16px;right:16px;font:600 10px 'JetBrains Mono';color:#fff;background:var(--lime);padding:3px 6px;border-radius:6px}
.pc b{display:block;font-size:13.5px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc span.t{font-size:11.5px;color:var(--mute)}
.setup{position:relative;min-height:100vh;display:grid;place-items:center;padding:30px 22px;background:url(/img/stadium.jpg) center/cover}
.setup:before{content:"";position:absolute;inset:0;background:rgba(8,9,12,.86)}
.setup .sin{position:relative;max-width:1200px;width:100%;display:grid;grid-template-columns:.85fr 1.3fr;gap:34px;align-items:center;animation:up .6s ease both}
.letter{background:#F6F2E7;color:#15161A;border-radius:6px;padding:30px 30px 26px;font:15.5px/1.65 Georgia,serif;box-shadow:0 30px 80px rgba(0,0,0,.55);transform:rotate(-1.2deg)}
.letter h4{font:600 12px 'JetBrains Mono';letter-spacing:.12em;margin-bottom:14px;color:#6D727B}
.letter p{margin-bottom:10px}.letter .sig{font:italic 22px Georgia,serif;margin-top:14px}
.letter table{width:100%;border-collapse:collapse;font:600 13px 'JetBrains Mono';margin:6px 0 12px}.letter td{padding:5px 4px;border-bottom:1px solid #DDD6C4}.letter tr.me td{background:#15161A;color:#F6F2E7}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.sty{position:relative;border-radius:16px;overflow:hidden;border:2px solid transparent;cursor:pointer;background-color:#15181D;aspect-ratio:3/4.2;background-size:cover;background-position:center top;text-align:left;padding:0;transition:transform .15s;opacity:.72}
.sty:hover{transform:translateY(-4px)}
.sty.on{border-color:#fff;box-shadow:0 0 0 4px rgba(110,134,255,.65);opacity:1}
.sty:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,12,0) 30%,rgba(8,9,12,.96) 100%)}
.sty div{position:absolute;left:14px;right:14px;bottom:12px}
.sty b{font:800 26px/1 'Barlow Condensed';text-transform:uppercase;display:block;color:#fff}
.sty span{font-size:12.5px;color:#C9CED3;line-height:1.4;display:block;margin-top:4px}
.sty em{font:600 11px 'JetBrains Mono';color:#9DB0FF;font-style:normal;display:block;margin-top:6px}
input.nm{width:100%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;font:600 17px Inter;padding:12px 14px;margin-bottom:14px}
.storyp{font:15.5px/1.6 Georgia,serif}
.headline{font:800 clamp(30px,4.4vw,58px)/.95 'Barlow Condensed';text-transform:uppercase;margin:4px 0 14px}
.paper{font:600 11px 'JetBrains Mono';letter-spacing:.12em;color:var(--mute)}
.tblwrap{max-height:318px;overflow:auto}
.strip{display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--panel);border-radius:14px;padding:13px 18px;margin-bottom:18px;font-size:15px;line-height:1.45}
.strip b{font:800 13px 'JetBrains Mono';letter-spacing:.1em;color:#9DB0FF;white-space:nowrap}
.pm{display:grid;grid-template-columns:240px 1fr;gap:22px;padding:22px}
.pm .ph{width:240px;height:240px;border-radius:18px;background-color:#2A2F38;background-repeat:no-repeat}
@media (max-width:1180px){.hub{grid-template-columns:1fr 1fr}.hub>:last-child{grid-column:1/-1}.cc{grid-template-columns:1fr 320px}.cc>:first-child{display:none}.fixture .fin{grid-template-columns:1fr auto 1fr}.boss{grid-column:1/-1;width:auto}}
@media (max-width:820px){.hub,.cc,.end,.mgrid,.two,.setup .sin,.pm{grid-template-columns:1fr}.mgrid>div+div{border-left:0;border-top:1px solid var(--line)}.title .in,.season .in{padding:24px 16px}.wrap{padding:14px}.big{font-size:44px}.sb h3{font-size:19px}.side h2{font-size:24px}.servchip span:not(.dot),.pips em{display:none}.ft{gap:12px;flex-wrap:wrap}.ft .n{font-size:64px}.ft h2{font-size:22px}.goalban b{font-size:90px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/game.js"></script>
<script>
(() => {
const app = $('#app');
const IMG = { blank: '/img/blank.jpg', ortega: '/img/ortega.jpg', ferrier: '/img/ferrier.jpg' };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sur = (n) => String(n).split(' ').slice(1).join(' ') || String(n);
const ord = (n) => n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');
const morCls = (m) => (m >= 8 ? 'g' : m >= 6 ? '' : 'b');
const ratCls = (r) => (r >= 7.4 ? 'g' : r < 6.2 ? 'b' : '');
const rat = (p) => clamp(p.rating || 6.5, 4, 10);

const LOGO = { you: 1, blank: 1, ortega: 1, ferrier: 1 };
function crest(c, s = 44) {
  if (LOGO[c.id] || /^o\d+$/.test(c.id)) return `<img src="/img/crest-${c.id}.jpg" alt="" width="${s}" height="${s}" style="width:${s}px;height:${s}px;border-radius:24%;flex:none;object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,.28)">`;
  return `<span style="width:${s}px;height:${s}px;border-radius:24%;flex:none;display:inline-grid;place-items:center;background:${c.color};color:#fff;font:800 ${Math.round(s * 0.42)}px 'Barlow Condensed';letter-spacing:.02em">${c.short.slice(0, s < 30 ? 1 : 3)}</span>`;
}
function faceCss(p) { const i = p.face || 0, k = i % 9, S = 3.5, pos = (c) => (((c * S - 0.5) / (S - 1)) * 100).toFixed(1); return `background-image:url(/img/faces${Math.floor(i / 9) + 1}.jpg);background-size:${S * 100}%;background-position:${pos(((k % 3) + 0.5) / 3)}% ${pos((Math.floor(k / 3) + 0.45) / 3)}%`; }
const face = (p, s) => `<span class="av" style="width:${s}px;height:${s}px;${faceCss(p)}"></span>`;
const MG = { style: 'motivator', name: '' };
const STYLES = {
  motivator: { name: 'The Motivator', img: 'mgr-motivator', line: 'Players run through walls for you.', perk: '+1 MORALE FOR THE WHOLE SQUAD' },
  tactician: { name: 'The Tactician', img: 'mgr-tactician', line: 'You see the game three moves ahead.', perk: 'YOUR ANALYSTS LEAK THE RIVAL LINE-UP' },
  sergeant: { name: 'The Sergeant', img: 'mgr-sergeant', line: 'Nobody outruns your team.', perk: '+8 STAMINA FOR THE WHOLE SQUAD' },
};
const BLURB = [
  'Opening day, and it is last season\'s champions. Blank\'s sides barely concede. Everyone starts on zero, so a win here puts you top.',
  'Away at the loudest ground in the country. Ortega\'s press has forced more mistakes than any side in the league, and she has now seen you play.',
  'Third game. Ferrier has had two matches to study you. Whatever you did to get here, he has watched it twice.',
];
function playerModal(p, buy) {
  const q = p.ref || p, ov = document.createElement('div'); ov.className = 'overlay'; ov.style.background = 'rgba(8,9,12,.78)';
  const bar = (l, v) => `<div class="row"><span class="pos" style="width:64px">${l}</span><div class="bar"><i style="width:${v}%;background:#6E86FF"></i></div><span class="pill">${v}</span></div>`;
  ov.innerHTML = `<div class="modal" style="max-width:760px"><div class="pm"><div class="ph" style="${faceCss(q)}"></div><div>
    <div class="small mono">${q.pos} · AGE ${q.age} · ${q.trait.toUpperCase()}</div><div class="cond" style="font-size:44px;font-weight:800;line-height:1">${esc(q.name)}</div>
    <p class="storyp" style="margin:12px 0 14px">${esc(q.story)}</p>
    ${bar('ATTACK', q.att)}${bar('DEFENCE', q.def)}${bar('STAMINA', q.sta)}${bar('MORALE', q.morale * 10)}
    <div class="small" style="margin-top:10px">${q.goals} goal${q.goals === 1 ? '' : 's'} this season · overall ${q.ovr} · value £${val(q)}m</div>
    <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center"><button class="btn" style="padding:9px 18px;font-size:16px" id="pmt"></button><button class="btn ghost" style="padding:9px 18px;font-size:16px" id="pmx">Close</button><span class="small" id="pmn"></span></div></div></div></div>`;
  document.body.appendChild(ov); ov.onclick = (e) => { if (e.target === ov || e.target.id === 'pmx') ov.remove(); };
  const sq = CLUBS.you.squad, bt = ov.querySelector('#pmt'), nt = ov.querySelector('#pmn'), MIN = { GK: 1, DF: 5, MF: 5, FW: 3 }, price = val(q);
  if (buy) {
    bt.textContent = `Sign for £${price}m`; nt.textContent = `From ${q.from} · you have £${state.budget}m`;
    if (state.budget < price) { bt.disabled = true; nt.textContent = `You only have £${state.budget}m`; }
    bt.onclick = () => { state.budget -= price; sq.push(q); MARKET.splice(MARKET.indexOf(q), 1); ov.remove(); drawBoard(); };
  } else if ($('#ko')) {
    bt.textContent = `Sell for £${price}m`;
    if (sq.filter((x) => x.pos === q.pos).length <= MIN[q.pos]) { bt.disabled = true; nt.textContent = `You need at least ${MIN[q.pos]} ${q.pos}`; }
    bt.onclick = () => { state.budget += price; sq.splice(sq.indexOf(q), 1); MARKET.push({ ...q, from: 'Ashford Town' }); ov.remove(); drawBoard(); };
  } else bt.remove();
}

// ---------- sound ----------
let AC = null, master = null, muted = false, amb = null;
function audio() { if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination); } catch (e) { AC = null; } }
function noiseBuf(sec) { const b = AC.createBuffer(1, AC.sampleRate * sec, AC.sampleRate), d = b.getChannelData(0); let last = 0; for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } return b; }
function ambience(on) {
  if (!AC) return;
  if (on && !amb) { const s = AC.createBufferSource(); s.buffer = noiseBuf(4); s.loop = true; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 650; f.Q.value = 0.4; const g = AC.createGain(); g.gain.value = 0.0001; g.gain.linearRampToValueAtTime(0.55, AC.currentTime + 1.5); s.connect(f); f.connect(g); g.connect(master); s.start(); amb = { s, g }; }
  else if (!on && amb) { const a = amb; amb = null; a.g.gain.linearRampToValueAtTime(0.0001, AC.currentTime + 0.8); setTimeout(() => { try { a.s.stop(); } catch (e) {} }, 900); }
}
function roar(big) { if (!AC) return; const s = AC.createBufferSource(); s.buffer = noiseBuf(3); const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = big ? 1100 : 800; f.Q.value = 0.5; const g = AC.createGain(), t = AC.currentTime; g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(big ? 2.4 : 0.9, t + 0.25); g.gain.exponentialRampToValueAtTime(0.001, t + (big ? 2.8 : 1.2)); s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(t + 3); }
function whistle(n = 1) { if (!AC) return; for (let i = 0; i < n; i++) { const t = AC.currentTime + i * 0.42, L = i === n - 1 ? 0.5 : 0.22; const o = AC.createOscillator(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain(); o.type = 'square'; o.frequency.value = 2350; l.frequency.value = 38; lg.gain.value = 90; l.connect(lg); lg.connect(o.frequency); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.1, t + 0.02); g.gain.setValueAtTime(0.1, t + L); g.gain.linearRampToValueAtTime(0, t + L + 0.08); o.connect(g); g.connect(master); o.start(t); l.start(t); o.stop(t + 0.8); l.stop(t + 0.8); } }

// ---------- top bar + SERV ----------
let inflight = 0;
function topbar() {
  const avgS = ledger.calls ? (ledger.ms / ledger.calls / 1000).toFixed(1) : '0.0';
  return `<div class="top"><div class="brand">TOUCH<i>LINE</i></div>
    <div class="pips">${[0, 1, 2].map((i) => `<span class="${i < state.md ? 'done' : i === state.md ? 'now' : ''}"></span>`).join('')}<em>Matchday ${Math.min(state.md + 1, 3)} / 3</em></div>
    <div class="servchip ${inflight ? 'busy' : ''}"><span class="dot"></span><b>SERV Reasoning</b><span>${inflight ? 'thinking…' : ledger.calls + (ledger.calls === 1 ? ' decision' : ' decisions')}</span><span>$${ledger.cost.toFixed(4)}</span><span>${avgS}s avg</span><span>${ledger.blocked} blocked</span></div>
    <button class="snd" id="snd">${muted ? 'Sound off' : 'Sound on'}</button></div>`;
}
function bindTop() { const b = $('#snd'); if (b) b.onclick = () => { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; refreshTop(); }; }
function refreshTop() { const t = $('.top'); if (t) { t.outerHTML = topbar(); bindTop(); } }
function call(body) { inflight++; refreshTop(); return serv(body).finally(() => { inflight--; refreshTop(); }); }

function fit(c, W, H) { c.width = W * 2; c.height = H * 2; const g = c.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0); return g; }
function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function shirt(g, x, y, col, ink, num, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.moveTo(-9, -13); g.lineTo(-17, -8); g.lineTo(-13, -1); g.lineTo(-9, -3); g.lineTo(-9, 13); g.lineTo(9, 13); g.lineTo(9, -3); g.lineTo(13, -1); g.lineTo(17, -8); g.lineTo(9, -13); g.quadraticCurveTo(0, -8, -9, -13); g.closePath();
  g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 8; g.shadowOffsetY = 4; g.fillStyle = col; g.fill(); g.shadowColor = 'transparent';
  g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 1.2; g.stroke();
  g.fillStyle = ink; g.font = '700 11px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(num, 0, 3); g.restore();
}

// ---------- title ----------
function title() {
  app.innerHTML = `<section class="title"><div class="bgi"></div><div class="in">
    <div class="cond" style="color:var(--lime);font-size:16px;letter-spacing:.14em;margin-bottom:10px">A football management game</div>
    <h1>Out-think<br><i>the dugout.</i></h1>
    <p>You've taken the Ashford Town job with three games to win the league. Every rival manager watches your last match, picks a plan to beat you and changes it at half-time. They think for themselves, and after each game you get to read their notes.</p>
    <div class="mgrs">${['blank', 'ortega', 'ferrier'].map((id) => `<div class="mgr"><img src="${IMG[id]}" alt=""><div><b>${CLUBS[id].manager}</b><span>${CLUBS[id].name} · ${CLUBS[id].tag}</span></div></div>`).join('')}</div>
    <button class="btn" id="go">Take the job</button>
  </div></section>`;
  $('#go').onclick = () => { audio(); ['dressing', 'champions', 'sacked', 'stadium', 'faces1', 'faces2', 'faces3', 'mgr-motivator', 'mgr-tactician', 'mgr-sergeant', 'crest-you', 'crest-blank', 'crest-ortega', 'crest-ferrier'].forEach((n) => { new Image().src = `/img/${n}.jpg`; }); setup(); };
}
function setup() {
  window.scrollTo(0, 0);
  const top = table().slice(0, 5), sq = CLUBS.you.squad;
  call({ action: 'bios', players: sq.map((p) => ({ name: p.name, pos: p.pos, age: p.age, trait: p.trait })) }).then((r) => { for (const b of r.bios || []) { const p = sq.find((x) => x.name === b.name); if (p && b.story) p.story = b.story; } }).catch(() => {});
  app.innerHTML = `<section class="setup"><div class="sin">
    <div class="letter"><h4>ASHFORD TOWN FC · OFFICE OF THE CHAIRMAN</h4>
      <p>Welcome to Ashford. I'll keep this short, because we don't have long.</p>
      <p>The season starts on Saturday and the fixture list has not been kind. Our first three matches are against last year's top three.</p>
      <table style="display:none">${top.map((r, i) => `<tr class="${r.id === 'you' ? 'me' : ''}"><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.gd >= 0 ? '+' : ''}${r.gd}</td><td>${r.pts}</td></tr>`).join('')}</table>
      <p>Blank, Ortega and Ferrier will each study what you did the week before. I have found you £12m for the squad. Spend it well, sell who you must, and be top of this league after three games. Otherwise we'll both be looking for work.</p>
      <div class="sig">M. Halloran</div><div style="font:600 11px 'JetBrains Mono';color:#6D727B">CHAIRMAN</div></div>
    <div><div class="cond" style="color:#9DB0FF;font-size:16px;letter-spacing:.14em">Before you sign</div>
      <div class="cond" style="font-size:56px;font-weight:800;line-height:.95;margin:4px 0 14px">What kind of manager are you?</div>
      <input class="nm" id="mname" maxlength="28" placeholder="Your name on the contract">
      <div class="styles">${Object.entries(STYLES).map(([k, v]) => `<button class="sty ${k === MG.style ? 'on' : ''}" data-k="${k}" style="background-image:url(/img/${v.img}.jpg)"><div><b>${v.name}</b><span>${v.line}</span><em>${v.perk}</em></div></button>`).join('')}</div>
      <button class="btn" id="sign">Sign the contract</button></div>
  </div></section>`;
  app.querySelectorAll('.sty').forEach((b) => (b.onclick = () => { MG.style = b.dataset.k; app.querySelectorAll('.sty').forEach((x) => x.classList.toggle('on', x === b)); }));
  $('#sign').onclick = () => {
    MG.name = $('#mname').value.trim() || 'The Gaffer';
    if (MG.style === 'motivator') sq.forEach((p) => (p.morale = Math.min(10, p.morale + 1)));
    if (MG.style === 'sergeant') sq.forEach((p) => (p.sta = Math.min(99, p.sta + 8)));
    prematch();
  };
}

// ---------- pre-match ----------
let plan = null, planP = null;
function tableHtml() {
  return `<div class="tblwrap"><table class="tbl"><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${table().map((r, i) => `<tr class="${r.id === 'you' ? 'me' : ''}"><td>${i + 1}</td><td><div>${crest(ALL[r.id], 18)}${esc(r.name)}</div></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gd >= 0 ? '+' : ''}${r.gd}</td><td><b>${r.pts}</b></td></tr>`).join('')}</table></div>`;
}
function prematch() {
  window.scrollTo(0, 0);
  const fx = FIXTURES[state.md], opp = CLUBS[fx.opp], t = state.tactics, last = opp.manager.split(' ')[1];
  plan = null;
  const report = scoutReport(fx.opp, state.md);
  planP = call({ action: 'plan', manager: fx.opp, report }).then((p) => (plan = { ...p, report })).catch(() => (plan = { ...FALLBACK, report, fallback: true }));
  const steps = state.md === 0 ? ['is reading the scouting report…', 'is checking your squad…', 'is picking a team to beat you…'] : ['is watching your last match…', 'has spotted how you attack…', 'is picking a team to beat you…'];
  let si = 0; const iv = setInterval(() => { const s = $('#oppstatus'); if (!s || plan) return clearInterval(iv); si = Math.min(si + 1, steps.length - 1); s.innerHTML = `<span class="pulse"></span>${last} ${steps[si]}`; }, 2600);
  planP.then(() => { const s = $('#oppstatus'); if (s) s.innerHTML = MG.style === 'tactician' ? `<span class="pulse ok"></span>Your analysts: expect ${plan.formation}, ${plan.press.toLowerCase()} press.` : `<span class="pulse ok"></span>Team sheet is in. You'll see it at kick-off.`; });
  const seg = (key, opts) => `<div class="seg" data-k="${key}">${opts.map((o) => `<button class="${t[key] === o ? 'on' : ''}" data-v="${o}">${o}</button>`).join('')}</div>`;
  const threats = [...opp.squad].sort((a, b) => b.att - a.att).slice(0, 4);
  if (t.mark !== 'None' && !threats.some((p) => p.name === t.mark)) t.mark = 'None';
  app.innerHTML = topbar() + `<div class="wrap">
    <section class="fixture"><div class="fin">
      <div class="side">${crest(CLUBS.you, 58)}<div><h2>Ashford Town</h2><span>YOU · ${fx.home ? 'HOME' : 'AWAY'}</span></div></div>
      <div class="vs"><span>MATCHDAY ${state.md + 1} OF 38</span><b>VS</b></div>
      <div class="side r"><div><h2>${opp.name}</h2><span>${opp.tag.toUpperCase()}</span></div>${crest(opp, 58)}</div>
      <div class="boss"><img src="${IMG[fx.opp]}" alt=""><div><b>${opp.manager}</b><em>${opp.line}</em><div class="status" id="oppstatus"><span class="pulse"></span>${last} ${steps[0]}</div></div></div>
    </div></section>
    <div class="strip"><b>THE STORY</b><span>${BLURB[state.md]}${state.md ? ` You are ${ord(table().findIndex((r) => r.id === 'you') + 1)} after ${state.md} game${state.md === 1 ? '' : 's'}.` : ''}</span></div>
    <div class="hub">
      <div class="tile"><div class="th">Tactics board <span class="mono" id="fl" style="font-size:12px;color:var(--lime)"></span></div><canvas id="pc"></canvas></div>
      <div class="tile"><div class="th">Team instructions</div><div class="tb tg">
        <div><label>FORMATION</label>${seg('formation', Object.keys(FORMS))}</div>
        <div><label>MENTALITY</label>${seg('mentality', ['Defensive', 'Balanced', 'Attacking'])}</div>
        <div><label>PRESS</label>${seg('press', ['Low', 'Mid', 'High'])}</div>
        <div><label>ATTACK THROUGH</label>${seg('attack_lane', ['Left', 'Centre', 'Right'])}</div>
        <div><label>MAN-MARK</label><select id="mark"><option value="None">Nobody</option>${threats.map((p) => `<option ${t.mark === p.name ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
        <div class="hint" id="hint"></div>
        <button class="btn wide" id="ko">Kick off</button>
      </div></div>
      <div class="tg">
        <div class="tile"><div class="th">League table</div><div class="tb" style="padding:8px 14px">${tableHtml()}</div></div>
        <div class="tile"><div class="th">Their dangermen</div><div class="tb" style="padding:8px 16px">${threats.map((p) => `<div class="row"><span class="pos">${p.pos}</span><span class="nm">${esc(p.name)}</span><div class="bar" style="max-width:90px"><i style="width:${p.att}%"></i></div><span class="pill">${p.att}</span></div>`).join('')}</div></div>
      </div>
    </div>
    <div class="tile" style="margin-top:18px"><div class="th">Your squad <span class="mono" style="font-size:11px">TAP A PLAYER FOR HIS STORY, OR TO SELL HIM</span></div><div class="tb"><div class="squad" id="squad"></div></div></div>
    <div class="tile" style="margin-top:18px"><div class="th">Transfer market <span class="mono" style="font-size:12px;color:var(--lime)" id="bud"></span></div><div class="tb"><div class="squad" id="market"></div></div></div>
    </div>`;
  bindTop();
  app.querySelectorAll('.seg').forEach((s) => s.querySelectorAll('button').forEach((b) => (b.onclick = () => { t[s.dataset.k] = b.dataset.v; s.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); drawBoard(); })));
  $('#mark').onchange = (e) => (t.mark = e.target.value);
  drawBoard();
  $('#ko').onclick = async () => {
    audio();
    if (!plan) { $('#ko').disabled = true; $('#ko').textContent = `Waiting for ${opp.manager}'s team sheet…`; await planP; }
    clearInterval(iv); play();
  };
}
const HINTS = {
  press: { High: 'High press wins the ball further up, but legs go after the hour and space opens behind you.', Mid: 'Mid press is the safe middle: steady midfield, steady legs.', Low: 'Low press gives up midfield to protect your back line and save energy.' },
  mentality: { Defensive: 'Defensive: harder to score against, fewer chances of your own.', Balanced: 'Balanced: no bonus, no weakness.', Attacking: 'Attacking: more chances for you, more room for them.' },
};
function drawBoard() {
  const c = $('#pc'); if (!c) return;
  const W = 560, H = 640, g = fit(c, W, H), t = state.tactics, xi = pickXI(CLUBS.you.squad, t.formation), f = FORMS[t.formation];
  for (let i = 0; i < 10; i++) { g.fillStyle = i % 2 ? '#1B1F27' : '#20252E'; g.fillRect(0, (H / 10) * i, W, H / 10); }
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2;
  g.strokeRect(22, 22, W - 44, H - 44); g.beginPath(); g.moveTo(22, H / 2); g.lineTo(W - 22, H / 2); g.stroke();
  g.beginPath(); g.arc(W / 2, H / 2, 58, 0, 7); g.stroke();
  g.strokeRect(W / 2 - 130, 22, 260, 96); g.strokeRect(W / 2 - 130, H - 118, 260, 96); g.strokeRect(W / 2 - 56, 22, 112, 36); g.strokeRect(W / 2 - 56, H - 58, 112, 36);
  const lx = { Left: 0.2, Centre: 0.5, Right: 0.8 }[t.attack_lane] * W;

  const sit = `${M.home.club.name} ${M.score[0]} - ${M.score[1]} ${M.away.club.name} at half-time. Ashford ${lead > 0 ? 'are winning' : lead < 0 ? 'are losing' : 'are level'}. Shots ${M.shots[M.meIdx]}-${M.shots[oppIdx]}.`;
  const seg = (k, opts) => `<div class="seg" data-k="${k}">${opts.map((o) => `<button class="${me.t[k] === o ? 'on' : ''}" data-v="${o}">${o}</button>`).join('')}</div>`;
  const roomHtml = (eff) => me.xi.map((p) => { const e = (eff || []).find((x) => x.name === p.name), r = rat(p); return `<div class="pr"><div class="l1">${face(p, 34)}<b>${esc(p.name)}</b>${e ? `<span class="delta ${e.change.startsWith('+') ? 'up' : 'down'}">${e.change}</span>` : ''}<span class="pill ${ratCls(r)}">${r.toFixed(1)}</span><span class="pill ${morCls(p.morale)}" title="Morale">M ${p.morale}</span></div><div class="tr">${p.slot} · ${p.age} · ${p.trait}</div>${e ? `<div class="why">${esc(e.reason)}</div>` : ''}</div>`; }).join('');
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="obg" style="background-image:url(/img/dressing.jpg)"></div><div class="modal">
    <div class="mh"><div><div class="small mono">HALF-TIME · ${M.home.club.short} ${M.score[0]}–${M.score[1]} ${M.away.club.short}</div><div class="cond" style="font-size:32px;font-weight:800;line-height:1.1">The dressing room</div></div>
      <div class="status" id="htstat"><span class="pulse"></span>${opp.manager} is re-thinking next door…</div></div>
    <div class="mgrid">
      <div class="tg">
        <div><label>YOUR TEAM TALK</label><textarea id="talk" placeholder="Say it like you would in the room. Every player takes it their own way."></textarea>
          <div class="quick">${['Keep doing this. Stay calm and trust the plan.', 'That was not good enough. I want more from everyone.', 'Brilliant half. Proud of you. Go and finish it.', 'Forget the score. Win your own battle out there.'].map((t) => `<button>${t}</button>`).join('')}</div></div>
        <div class="two"><div><label>MENTALITY</label>${seg('mentality', ['Defensive', 'Balanced', 'Attacking'])}</div><div><label>PRESS</label>${seg('press', ['Low', 'Mid', 'High'])}</div></div>
        <div><label>ATTACK THROUGH</label>${seg('attack_lane', ['Left', 'Centre', 'Right'])}</div>
        <button class="btn wide" id="out">Give the talk</button>
      </div>
      <div><div id="tone" class="tg"><label>THE ROOM · FIRST-HALF RATING · MORALE</label></div><div class="room" id="room">${roomHtml()}</div></div>
    </div></div>`;
  document.body.appendChild(ov);
  htP.then(() => { const s = $('#htstat'); if (s) s.innerHTML = `<span class="pulse ok"></span>${opp.manager} has made a decision.`; });
  ov.querySelectorAll('.quick button').forEach((b) => (b.onclick = () => ($('#talk').value = b.textContent)));
  ov.querySelectorAll('.seg').forEach((s) => s.querySelectorAll('button').forEach((b) => (b.onclick = () => { me.t[s.dataset.k] = b.dataset.v; s.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); })));
  let given = false;
  $('#out').onclick = async () => {
    if (!given) {
      const text = $('#talk').value.trim() || 'Keep going, lads.';
      $('#out').disabled = true; $('#out').textContent = 'The players are listening…';
      try { talkRes = await call({ action: 'talk', text, situation: sit, players: me.xi.map((p) => ({ name: p.name, pos: p.slot, age: p.age, trait: p.trait, morale: p.morale, rating: rat(p).toFixed(1) })) }); }
      catch (e) { talkRes = { tone: 'Unclear', effects: [], room: 'The room is quiet.' }; }
      for (const ef of talkRes.effects || []) { const p = me.xi.find((x) => x.name === ef.name); if (p) { p.morale = clamp(p.morale + parseInt(ef.change, 10), 1, 10); p.ref.morale = p.morale; } }
      $('#tone').innerHTML = `<div><div class="tone" style="color:${talkRes.blocked ? 'var(--red)' : 'var(--lime)'}">${talkRes.blocked ? 'Blocked' : esc(talkRes.tone)}</div><p style="font-size:14.5px;line-height:1.5;margin-bottom:10px">${esc(talkRes.room)}</p></div>`;
      $('#room').innerHTML = roomHtml(talkRes.effects);
      given = true; $('#out').disabled = false; $('#out').textContent = 'Second half';
      return;
    }
    $('#out').disabled = true; $('#out').textContent = `Waiting for ${opp.manager}…`;
    await htP; ov.remove();
    const them = [M.home, M.away][oppIdx];
    if (htPlan) {
      Object.assign(them.t, { formation: htPlan.formation, mentality: htPlan.mentality, press: htPlan.press, attack_lane: htPlan.attack_lane, mark: htPlan.mark });
      them.xi = pickXI(them.club.squad, htPlan.formation); M.htPlan = htPlan; layout(oppIdx);
      $('#rival').innerHTML = planCard(opp, htPlan, 'Changed at half-time');
      feed({ min: 45, text: `${opp.manager} comes out with ${htPlan.formation}, ${htPlan.mentality.toLowerCase()}, ${htPlan.press.toLowerCase()} press. "${htPlan.quote}"`, type: 'note' });
    }
    whistle(1); feed({ min: 46, text: 'The second half is under way.', type: 'note' });
    await half(90);
    fulltime();
  };
}

// ---------- full-time ----------
function fulltime() {
  whistle(3); ambience(false); sim = null; window.scrollTo(0, 0);
  const fx = FIXTURES[state.md], me = M.meIdx, op = M.oppIdx, opp = CLUBS[M.oppId], first = opp.manager.split(' ')[0];
  state.results.push([M.home.club.id, M.away.club.id, M.score[0], M.score[1]]);
  const [o1, o2] = fx.other, os = quickSim(o1, o2, 900 + state.md);
  state.results.push([o1, o2, os[0], os[1]]); simOthers(state.md).forEach((x) => state.results.push(x));
  const L = M.lanes[me], lt = L.Left + L.Centre + L.Right || 1, myT = [M.home, M.away][me].t, tot = M.poss[0] + M.poss[1] || 1;
  state.history.push({ opp: opp.name, score: [M.score[me], M.score[op]], t: { ...myT }, lanePct: `Their attacks went ${Math.round((L.Left / lt) * 100)}% left, ${Math.round((L.Centre / lt) * 100)}% centre, ${Math.round((L.Right / lt) * 100)}% right`, poss: Math.round((M.poss[me] / tot) * 100), shots: M.shots[me], xg: M.xg[me].toFixed(2) });
  Object.assign(state.tactics, { mentality: myT.mentality, press: myT.press, attack_lane: myT.attack_lane });
  const res = M.score[me] > M.score[op] ? 'WIN' : M.score[me] < M.score[op] ? 'DEFEAT' : 'DRAW';
  const rc = res === 'WIN' ? 'background:var(--lime);color:#fff' : res === 'DEFEAT' ? 'background:var(--red);color:#fff' : 'background:var(--panel2);color:var(--ink)';
  const notes = (p, lab) => (p ? `<div class="sec">${lab} · ${p.formation} · ${p.mentality} · ${p.press} press · attack ${p.attack_lane}${p.mark && p.mark !== 'None' ? ' · mark ' + esc(sur(p.mark)) : ''}</div><div class="tl">${p.notes.map((n, i) => `<div class="nt" style="animation-delay:${i * 0.08}s"><div class="s"><span class="k">SAW</span>${esc(n.saw)}</div><div class="d"><span class="k">DECIDED</span>${esc(n.decided)}</div></div>`).join('')}</div>` : '');
  const all = [...M.home.xi.map((p) => ({ p, c: M.home.club })), ...M.away.xi.map((p) => ({ p, c: M.away.club }))].sort((a, b) => rat(b.p) - rat(a.p)).slice(0, 5);
  const ph = Math.round((M.poss[0] / tot) * 100), last = state.md === FIXTURES.length - 1;
  const sc = (side) => M.scorers.filter((s) => s.side === side).map((s) => `${esc(sur(s.name))} ${s.min}'`).join(', ');
  const strow = (lab, a, b) => `<div class="row"><span class="pill" style="min-width:52px">${a}</span><span class="nm" style="text-align:center;color:var(--mute);font:600 11px 'JetBrains Mono';letter-spacing:.08em">${lab}</span><span class="pill" style="min-width:52px">${b}</span></div>`;
  app.innerHTML = topbar() + `<div class="wrap">
    <section class="hero"><div class="hin"><span class="res" style="${rc}">FULL-TIME · ${res}</span><div class="paper">THE MORNING PAPERS</div><div class="headline">${res === 'WIN' ? (M.score[me] - M.score[op] >= 2 ? `Ashford tear ${esc(opp.name)} apart` : `${esc(MG.name)} outwits ${esc(opp.manager.split(' ')[1])}`) : res === 'DRAW' ? `Honours even as title race tightens` : `${esc(opp.manager.split(' ')[1])} reads ${esc(MG.name)} like a book`}</div>
      <div class="ft">${crest(M.home.club, 64)}<div style="text-align:right"><h2>${M.home.club.name}</h2><div class="small">${sc(0)}</div></div><div class="n ftscore">${M.score[0]}–${M.score[1]}</div><div style="text-align:left"><h2>${M.away.club.name}</h2><div class="small">${sc(1)}</div></div>${crest(M.away.club, 64)}</div>
      <div class="small" style="margin-top:8px">Elsewhere: ${CLUBS[o1].name} ${os[0]}–${os[1]} ${CLUBS[o2].name}</div></div></section>
    <div class="end">
      <div class="tg">
        <div class="tile"><div class="th">Match stats <span class="mono" style="font-size:11px">${M.home.club.short} · ${M.away.club.short}</span></div><div class="tb" style="padding:6px 16px">${strow('POSSESSION', ph + '%', 100 - ph + '%')}${strow('SHOTS', M.shots[0], M.shots[1])}${strow('EXPECTED GOALS', M.xg[0].toFixed(2), M.xg[1].toFixed(2))}</div></div>
        <div class="tile"><div class="th">Best on the pitch</div><div class="tb" style="padding:6px 16px">${all.map(({ p, c }) => `<div class="row">${crest(c, 16)}<span class="nm">${esc(p.name)}</span><span class="pos">${p.slot}</span><span class="pill ${ratCls(rat(p))}">${rat(p).toFixed(1)}</span></div>`).join('')}</div></div>
        <div class="tile"><div class="th">League table</div><div class="tb" style="padding:8px 14px">${tableHtml()}</div></div>
        <button class="btn wide" id="nx">${last ? 'Final standings' : 'Next match'}</button>
      </div>
      <div class="tile"><div class="th">${opp.manager}'s notebook <span class="mono" style="font-size:11px;color:var(--lime)">SERV REASONING</span></div><div class="tb">
        <div class="rival"><img src="${IMG[opp.id]}" alt=""><div class="small">Every decision ${first} made in this match, each one tied to the fact that caused it. ${first} read the same report and match stats you can see.</div></div>
        ${notes(M.prePlan, 'BEFORE KICK-OFF')}${notes(M.htPlan, 'AT HALF-TIME')}
        <details><summary>The scouting report ${first} was given</summary><pre>${esc(M.prePlan.report)}</pre></details>
      </div></div>
    </div></div>`;
  bindTop();
  $('#nx').onclick = () => { state.md++; last ? season() : prematch(); };
}
function season() {
  window.scrollTo(0, 0);
  const t = table(), pos = t.findIndex((r) => r.id === 'you') + 1;
  const img = pos === 1 ? 'champions' : pos <= 4 ? 'tunnel' : 'sacked', who = esc(MG.name);
  const head = pos === 1 ? 'Top of the league.' : pos <= 4 ? 'In the hunt.' : 'Sacked.';
  const msg = pos === 1 ? `Three games, last season's top three, and Ashford Town lead the league. Three managers studied ${who}, countered and changed things at half-time. None of them could stop it.` : pos <= 4 ? `Ashford sit ${ord(pos)} after the hardest start in the division. The chairman wanted top spot, and one of those managers read ${who} a little too well.` : `Ashford are ${ord(pos)} after three games. Mr Halloran has thanked ${who} for the effort and cleared the office.`;
  const share = encodeURIComponent(`I finished ${ord(pos)} in Touchline, a football manager where every rival manager thinks for itself on @openservai SERV Reasoning. Can you win the league? ${location.origin}`);
  app.innerHTML = topbar() + `<section class="season" style="background-image:url(/img/${img}.jpg)"><div class="in">
    <div class="cond" style="color:var(--lime);font-size:16px;letter-spacing:.14em;margin-bottom:8px">Final standings · ${ord(pos)} place</div>
    <h1>${head}</h1><p style="margin:14px 0 18px;font-size:17px;line-height:1.5;color:#D5DBD3">${msg}</p>
    <div class="tile"><div class="tb" style="padding:8px 14px">${tableHtml()}</div></div>
    <div class="small mono" style="margin-top:12px">${ledger.calls} SERV decisions · $${ledger.cost.toFixed(4)} total · ${ledger.blocked} team talk${ledger.blocked === 1 ? '' : 's'} blocked by Prompt Guard</div>
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><a class="btn" target="_blank" rel="noopener" href="https://x.com/intent/post?text=${share}">Share result</a><button class="btn ghost" id="again">New season</button></div>
  </div></section>`;
  bindTop(); if (pos === 1) roar(true);
  $('#again').onclick = () => location.reload();
}
title();
})();
</script>
</body>
</html>
